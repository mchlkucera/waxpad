name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Assemble .app bundle
        run: |
          mkdir -p Waxpad.app/Contents/MacOS
          mkdir -p Waxpad.app/Contents/Resources

          cp .build/apple/Products/Release/Waxpad Waxpad.app/Contents/MacOS/Waxpad

          if [ -f Waxpad/AppIcon.icns ]; then
            cp Waxpad/AppIcon.icns Waxpad.app/Contents/Resources/AppIcon.icns
          fi

          cat > Waxpad.app/Contents/Info.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Waxpad</string>
            <key>CFBundleDisplayName</key>
            <string>Waxpad</string>
            <key>CFBundleIdentifier</key>
            <string>com.mchlkucera.waxpad</string>
            <key>CFBundleVersion</key>
            <string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleShortVersionString</key>
            <string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleExecutable</key>
            <string>Waxpad</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>LSUIElement</key>
            <true/>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
          </dict>
          </plist>
          PLIST

      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent Waxpad.app Waxpad-macOS.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: Waxpad-macOS.zip
          generate_release_notes: true

  update-homebrew:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download source tarball and compute SHA256
        id: sha
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TARBALL_URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          curl -sL "$TARBALL_URL" -o source.tar.gz
          SHA256=$(sha256sum source.tar.gz | awk '{print $1}')
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "Computed SHA256: ${SHA256}"

      - name: Clone homebrew-tap and update formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          SHA256="${{ steps.sha.outputs.sha256 }}"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/mchlkucera/homebrew-tap.git" tap
          cd tap

          # Update the url line (tag version)
          sed -i "s|url \"https://github.com/mchlkucera/waxpad/archive/refs/tags/.*\.tar\.gz\"|url \"https://github.com/mchlkucera/waxpad/archive/refs/tags/${TAG}.tar.gz\"|" Formula/waxpad.rb

          # Update the sha256 line
          sed -i "s|sha256 \"[a-f0-9]*\"|sha256 \"${SHA256}\"|" Formula/waxpad.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/waxpad.rb
          git commit -m "waxpad ${TAG}"
          git push
