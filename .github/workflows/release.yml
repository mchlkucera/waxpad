name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Assemble .app bundle
        run: |
          mkdir -p Waxpad.app/Contents/MacOS
          mkdir -p Waxpad.app/Contents/Resources

          cp .build/apple/Products/Release/Waxpad Waxpad.app/Contents/MacOS/Waxpad

          if [ -f Waxpad/AppIcon.icns ]; then
            cp Waxpad/AppIcon.icns Waxpad.app/Contents/Resources/AppIcon.icns
          fi

          cat > Waxpad.app/Contents/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Waxpad</string>
            <key>CFBundleDisplayName</key>
            <string>Waxpad</string>
            <key>CFBundleIdentifier</key>
            <string>com.mchlkucera.waxpad</string>
            <key>CFBundleVersion</key>
            <string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleShortVersionString</key>
            <string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleExecutable</key>
            <string>Waxpad</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>LSUIElement</key>
            <true/>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
          </dict>
          </plist>
          PLIST

      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent Waxpad.app Waxpad-macOS.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Waxpad-macOS.zip
          generate_release_notes: true
